name: Build Viraso Admin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore viraso-admin-android/app/release.keystore \
            -alias viraso \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass viraso2026 \
            -keypass viraso2026 \
            -dname "CN=Viraso Admin, OU=Viraso, O=Marjara Enterprises, L=Ludhiana, ST=Punjab, C=IN"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x viraso-admin-android/gradlew

      - name: Build Signed Release APK
        working-directory: viraso-admin-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp viraso-admin-android/app/build/outputs/apk/release/app-release.apk output/VirasoAdmin.apk
          echo "Release APK generated successfully at output/VirasoAdmin.apk"
          ls -lh output/VirasoAdmin.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirasoAdmin-APK
          path: output/VirasoAdmin.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Viraso Admin Android App v1.0.3 (Professional & Live Notifications)"
          body: |
            ## Viraso Admin Mobile App v1.0.3 📱

            Professional Admin App with **real-time audio chime alerts and push notifications** for orders, customer complaints, and B2B wholesale inquiries.

            ### What's New in v1.0.3:
            - **Guaranteed CSS Rendering**: Fixed mobile styling issues with embedded styles and modern Chrome user-agent.
            - **Live Sound Alerts**: Audible chime whenever an order, complaint, or B2B lead comes in.
            - **Mobile Bottom Navigation Bar**: Quick 1-tap switching between Dashboard, Orders, Complaints, and B2B Leads.
            - **Notification Center Drawer**: Bell badge with live count of pending orders and complaints.
            - **Phone Push Notifications**: Android system push notifications for new incoming orders and complaints.
            - **Signed Production Release**: Full installation compatibility across all Android devices.

            ### Installation Instructions:
            1. If you previously tried installing an earlier test version of the app, **uninstall it first**.
            2. Download `VirasoAdmin.apk` below.
            3. Open your phone's **Downloads** and tap `VirasoAdmin.apk`.
            4. If Google Play Protect displays a prompt: tap **"More details"** and tap **"Install anyway"**.
            5. Open the app and log in to your Viraso admin portal!
          files: output/VirasoAdmin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
