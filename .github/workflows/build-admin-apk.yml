name: Build Viraso Admin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x viraso-admin-android/gradlew

      - name: Build Debug APK
        working-directory: viraso-admin-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp viraso-admin-android/app/build/outputs/apk/debug/app-debug.apk output/VirasoAdmin.apk
          echo "APK generated successfully at output/VirasoAdmin.apk"
          ls -lh output/VirasoAdmin.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirasoAdmin-APK
          path: output/VirasoAdmin.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Viraso Admin Android App v1.0.0"
          body: |
            ## Viraso Admin Mobile App (APK) 📱

            Direct download link for the Viraso Admin Android application.

            ### Features:
            - **Native Viraso UI**: Fullscreen, fast mobile operations for orders, CRM, inventory & B2B inquiries.
            - **Pull to Refresh**: Quick refresh for live order tracking.
            - **Camera & Photo Uploads**: Direct camera and gallery file picker for product images & shipping receipts.
            - **Server URL Switcher**: Built-in dialog to point to your live domain (`https://viraso.in`) or any server URL.
            - **Hardware Back Button Handling**: Smooth in-app navigation without accidental exit.

            ### How to Install:
            1. Download `VirasoAdmin.apk` to your Android phone.
            2. Tap the downloaded file to install.
            3. If prompted, select "Allow from this source" in your phone settings.
            4. Open **Viraso Admin** and log in!
          files: output/VirasoAdmin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
