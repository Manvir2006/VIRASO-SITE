name: Build Viraso Admin APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore viraso-admin-android/app/release.keystore \
            -alias viraso \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass viraso2026 \
            -keypass viraso2026 \
            -dname "CN=Viraso Admin, OU=Viraso, O=Marjara Enterprises, L=Ludhiana, ST=Punjab, C=IN"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x viraso-admin-android/gradlew

      - name: Build Signed Release APK
        working-directory: viraso-admin-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp viraso-admin-android/app/build/outputs/apk/release/app-release.apk output/VirasoAdmin.apk
          echo "Release APK generated successfully at output/VirasoAdmin.apk"
          ls -lh output/VirasoAdmin.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirasoAdmin-APK
          path: output/VirasoAdmin.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "Viraso Admin Android App v1.0.2 (Signed Release)"
          body: |
            ## Viraso Admin Mobile App (Signed Release APK) 📱

            Direct download link for the Viraso Admin Android application configured for **https://virasoindia.store/admin**.

            ### Release Notes:
            - **Signed Production Release**: Signed with a permanent release keystore (v1 + v2 APK signature schemes) for compatibility with all Android phones (Samsung, Xiaomi, Vivo, Oppo, Realme, OnePlus, Pixel).
            - **Min SDK 21**: Supports Android 5.0 through Android 14.
            - **Target URL**: Baked in default to `https://virasoindia.store/admin`.

            ### Installation Instructions:
            1. If you previously tried installing an earlier test version of the app, **uninstall it first**.
            2. Download `VirasoAdmin.apk` below.
            3. Open your phone's **Downloads** and tap `VirasoAdmin.apk`.
            4. If Google Play Protect displays a prompt: tap **"More details"** and tap **"Install anyway"**.
            5. Open the app and log in to your Viraso admin portal!
          files: output/VirasoAdmin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
